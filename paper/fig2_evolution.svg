<svg width="950" height="650" viewBox="0 0 950 650" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:"DejaVu Sans",sans-serif}</style>
<rect width="950" height="650" fill="#020617"/>
<text x="475" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="bold">Figure 2. Research Evolution: From BERTopic to Hierarchical Catalog Pipeline</text>
<text x="475" y="48" text-anchor="middle" fill="#94a3b8" font-size="10">13 experiments across 12 months of iterative development</text><line x1="80" y1="340" x2="900" y2="340" stroke="#334155" stroke-width="2"/><circle cx="100" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="100" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">A</text><circle cx="158" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="158" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">B</text><circle cx="216" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="216" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">C</text><circle cx="274" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="274" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">D</text><circle cx="332" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="332" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">E</text><circle cx="390" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="390" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">F</text><circle cx="448" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="448" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">G</text><circle cx="506" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="506" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">H</text><circle cx="564" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="564" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">I</text><circle cx="622" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="622" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">I.2</text><circle cx="680" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="680" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">J</text><circle cx="738" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="738" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">K</text><circle cx="796" cy="340" r="6" fill="#22d3ee" stroke="#020617" stroke-width="2"/><text x="796" y="360" text-anchor="middle" fill="#94a3b8" font-size="9">Final</text><rect x="50" y="80" width="270" height="170" rx="6" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="1"/><text x="62" y="100" fill="#6366f1" font-size="11" font-weight="bold">Phase I: BERTopic Exploration (Exp A-H)</text><text x="62" y="120" fill="#cbd5e1" font-size="9">BERTopic, K-Means, Hierarchical, UMAP,</text><text x="62" y="136" fill="#cbd5e1" font-size="9">HDBSCAN, Embedding tuning, Short text</text><text x="62" y="152" fill="#cbd5e1" font-size="9">augmentation, Outlier reassignment</text><rect x="360" y="80" width="270" height="170" rx="6" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1"/><text x="372" y="100" fill="#8b5cf6" font-size="11" font-weight="bold">Phase II: Graph-Based Clustering (Exp I-K)</text><text x="372" y="120" fill="#cbd5e1" font-size="9">k-NN graph + Leiden (multiresolution),</text><text x="372" y="136" fill="#cbd5e1" font-size="9">Bayesian GMM (Dirichlet Process),</text><text x="372" y="152" fill="#cbd5e1" font-size="9">LLM evaluation, Consensus clustering</text><rect x="640" y="80" width="270" height="170" rx="6" fill="#22d3ee" opacity="0.15" stroke="#22d3ee" stroke-width="1"/><text x="652" y="100" fill="#22d3ee" font-size="11" font-weight="bold">Phase III: Hierarchical Catalog (Final)</text><text x="652" y="120" fill="#cbd5e1" font-size="9">Iterative Leiden refine + Rule scoring +</text><text x="652" y="136" fill="#cbd5e1" font-size="9">LLM-augmented judge + Finite State</text><text x="652" y="152" fill="#cbd5e1" font-size="9">Machine orchestration → 94.3% coverage</text><text x="50" y="450" fill="#e2e8f0" font-size="11" font-weight="bold">Coverage</text><rect x="50" y="458" width="80" height="22" rx="3" fill="#1e293b"/><text x="90" y="473" text-anchor="middle" fill="#22d3ee" font-size="9">65%</text><text x="90" y="495" text-anchor="middle" fill="#64748b" font-size="8">A</text><rect x="150" y="458" width="80" height="22" rx="3" fill="#1e293b"/><text x="190" y="473" text-anchor="middle" fill="#22d3ee" font-size="9">84%</text><text x="190" y="495" text-anchor="middle" fill="#64748b" font-size="8">B</text><rect x="250" y="458" width="80" height="22" rx="3" fill="#1e293b"/><text x="290" y="473" text-anchor="middle" fill="#22d3ee" font-size="9">88%</text><text x="290" y="495" text-anchor="middle" fill="#64748b" font-size="8">H</text><rect x="350" y="458" width="80" height="22" rx="3" fill="#1e293b"/><text x="390" y="473" text-anchor="middle" fill="#22d3ee" font-size="9">100%</text><text x="390" y="495" text-anchor="middle" fill="#64748b" font-size="8">I</text><rect x="450" y="458" width="80" height="22" rx="3" fill="#1e293b"/><text x="490" y="473" text-anchor="middle" fill="#22d3ee" font-size="9">94.3%</text><text x="490" y="495" text-anchor="middle" fill="#64748b" font-size="8">Final</text><text x="50" y="530" fill="#e2e8f0" font-size="11" font-weight="bold">Topics</text><rect x="50" y="538" width="80" height="22" rx="3" fill="#1e293b"/><text x="90" y="553" text-anchor="middle" fill="#22d3ee" font-size="9">35</text><text x="90" y="575" text-anchor="middle" fill="#64748b" font-size="8">A</text><rect x="150" y="538" width="80" height="22" rx="3" fill="#1e293b"/><text x="190" y="553" text-anchor="middle" fill="#22d3ee" font-size="9">84</text><text x="190" y="575" text-anchor="middle" fill="#64748b" font-size="8">B</text><rect x="250" y="538" width="80" height="22" rx="3" fill="#1e293b"/><text x="290" y="553" text-anchor="middle" fill="#22d3ee" font-size="9">96</text><text x="290" y="575" text-anchor="middle" fill="#64748b" font-size="8">H</text><rect x="350" y="538" width="80" height="22" rx="3" fill="#1e293b"/><text x="390" y="553" text-anchor="middle" fill="#22d3ee" font-size="9">29</text><text x="390" y="575" text-anchor="middle" fill="#64748b" font-size="8">I</text><rect x="450" y="538" width="80" height="22" rx="3" fill="#1e293b"/><text x="490" y="553" text-anchor="middle" fill="#22d3ee" font-size="9">585</text><text x="490" y="575" text-anchor="middle" fill="#64748b" font-size="8">Final</text></svg>