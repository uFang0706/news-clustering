    <text x="135" y="10" class="legend-text">UMAP(50)+GMM</text>
    <rect x="300" y="0" width="12" height="12" rx="2" fill="url(#gbar2)"/>
    <text x="316" y="10" class="legend-text">Fusion 流水线</text>
