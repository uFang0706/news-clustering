  <!-- Legend -->
  <g transform="translate(30, 400)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#gbar1)"/>
    <text x="16" y="10" class="legend-text">PCA(50)+GMM</text>
    <rect x="150" y="0" width="12" height="12" rx="2" fill="url(#gbar2)"/>
    <text x="166" y="10" class="legend-text">mpnet+PCA(200)+GMM</text>
    <rect x="360" y="0" width="12" height="12" rx="2" fill="url(#gbar3)"/>
    <text x="376" y="10" class="legend-text">GSDMM</text>
  </g>
  <g transform="translate(30, 418)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#gbar4)"/>
    <text x="16" y="10" class="legend-text">TopiCLEAR</text>
