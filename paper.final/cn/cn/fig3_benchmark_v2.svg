<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gbar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f5878"/>
      <stop offset="100%" stop-color="#2c6e8a"/>
    </linearGradient>
    <linearGradient id="gbar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9bb5"/>
      <stop offset="100%" stop-color="#2c6e8a"/>
    </linearGradient>
    <linearGradient id="gbar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <linearGradient id="gbar4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <pattern id="hatch1" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M-1,1 l2,-2 M0,4 l4,-4 M3,5 l2,-2" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'DejaVu Sans', 'Arial', sans-serif; }
    .title { fill: #1a1a2e; font-size: 14px; font-weight: bold; }
    .subtitle { fill: #555; font-size: 10px; }
    .axis-label { fill: #333; font-size: 10px; }
    .tick-label { fill: #555; font-size: 8px; }
    .bar-label { fill: #fff; font-size: 7px; font-weight: bold; }
    .legend-text { fill: #333; font-size: 9px; }
    .method-label { fill: #333; font-size: 8px; }
  </style>

  <rect width="800" height="500" fill="#ffffff" rx="4"/>

  <!-- Title -->
  <text x="400" y="24" text-anchor="middle" class="title">图3. 定量基准：五种聚类方法 × 四项指标</text>
  <text x="400" y="40" text-anchor="middle" class="subtitle">ABC News数据集10,000条标题子集。所有方法统一为50个聚类。</text>

  <!-- Grid definitions -->
  <!-- We have 4 metric panels: Silhouette, CH, DB, 连贯性 -->
  <!-- Panel widths: ~180px each with 20px gap -->

  <!-- ============ Panel 1: Silhouette ============ -->
  <g transform="translate(0,0)">
    <text x="95" y="60" text-anchor="middle" class="axis-label" font-weight="bold">Silhouette ↑</text>
    <line x1="20" y1="72" x2="20" y2="310" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="310" x2="170" y2="310" stroke="#ccc" stroke-width="1"/>

    <!-- Gridlines -->
    <line x1="20" y1="310" x2="170" y2="310" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="250" x2="170" y2="250" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="191" x2="170" y2="191" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="131" x2="170" y2="131" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="72" x2="170" y2="72" stroke="#eee" stroke-width="0.5"/>

    <!-- Y-axis labels (0 to 0.25) -->
    <text x="16" y="313" text-anchor="end" class="tick-label">0.00</text>
    <text x="16" y="252" text-anchor="end" class="tick-label">0.05</text>
    <text x="16" y="193" text-anchor="end" class="tick-label">0.10</text>
    <text x="16" y="134" text-anchor="end" class="tick-label">0.15</text>
    <text x="16" y="74" text-anchor="end" class="tick-label">0.20</text>

    <!-- Bar data: Silhouette values (scaled: 0→310, 0.25→72, range=238) -->
    <!-- PCA(50)+GMM: 0.18 -->
    <rect x="26" y="131.4" width="22" height="178.6" rx="2" fill="url(#gbar1)" opacity="0.9"/>
    <text x="37" y="128.4" text-anchor="middle" class="bar-label">0.18</text>
    <!-- mpnet+PCA(200)+GMM: 0.22 -->
    <rect x="50" y="96.4" width="22" height="213.6" rx="2" fill="url(#gbar2)" opacity="0.9"/>
    <text x="61" y="93.4" text-anchor="middle" class="bar-label">0.22</text>
    <!-- GSDMM: 0.08 -->
    <rect x="74" y="233.8" width="22" height="76.2" rx="2" fill="url(#gbar3)" opacity="0.9"/>
    <text x="85" y="230.8" text-anchor="middle" class="bar-label">0.08</text>
    <!-- TopiCLEAR: 0.20 -->
    <rect x="98" y="119.6" width="22" height="190.4" rx="2" fill="url(#gbar4)" opacity="0.9"/>
    <text x="109" y="116.6" text-anchor="middle" class="bar-label">0.20</text>
    <!-- UMAP(50)+GMM: 0.15 -->
    <rect x="122" y="167.0" width="22" height="143.0" rx="2" fill="url(#gbar1)" opacity="0.9"/>
    <text x="133" y="164.0" text-anchor="middle" class="bar-label">0.15</text>
    <!-- Fusion 流水线: 0.21 -->
    <rect x="146" y="108.2" width="22" height="201.8" rx="2" fill="url(#gbar2)" opacity="0.9"/>
    <text x="157" y="105.2" text-anchor="middle" class="bar-label">0.21</text>

    <!-- X labels (rotated) -->
    <text x="37" y="325" text-anchor="end" class="method-label" transform="rotate(-60,37,325)">PCA+GMM</text>
    <text x="61" y="325" text-anchor="end" class="method-label" transform="rotate(-60,61,325)">mpnet+GMM</text>
    <text x="85" y="325" text-anchor="end" class="method-label" transform="rotate(-60,85,325)">GSDMM</text>
    <text x="109" y="325" text-anchor="end" class="method-label" transform="rotate(-60,109,325)">TopiCLEAR</text>
    <text x="133" y="325" text-anchor="end" class="method-label" transform="rotate(-60,133,325)">UMAP+GMM</text>
    <text x="157" y="325" text-anchor="end" class="method-label" transform="rotate(-60,157,325)">Fusion</text>
  </g>

  <!-- ============ Panel 2: CH 分数 ============ -->
  <g transform="translate(190,0)">
    <text x="95" y="60" text-anchor="middle" class="axis-label" font-weight="bold">CH 分数 ↑</text>
    <line x1="20" y1="72" x2="20" y2="310" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="310" x2="170" y2="310" stroke="#ccc" stroke-width="1"/>

    <!-- Gridlines -->
    <line x1="20" y1="310" x2="170" y2="310" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="260" x2="170" y2="260" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="210" x2="170" y2="210" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="160" x2="170" y2="160" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="110" x2="170" y2="110" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="72" x2="170" y2="72" stroke="#eee" stroke-width="0.5"/>

    <!-- Y-axis labels (200 to 1000) -->
    <text x="16" y="313" text-anchor="end" class="tick-label">200</text>
    <text x="16" y="262" text-anchor="end" class="tick-label">400</text>
    <text x="16" y="212" text-anchor="end" class="tick-label">600</text>
    <text x="16" y="162" text-anchor="end" class="tick-label">800</text>
    <text x="16" y="112" text-anchor="end" class="tick-label">1000</text>

    <!-- Bar data: CH (range 200→1000 = 310→72, so 200=310, 1000=72, range=238 for 800) -->
    <!-- PCA(50)+GMM: 850 -->
    <rect x="26" y="131.4" width="22" height="178.6" rx="2" fill="url(#gbar1)" opacity="0.9"/>
    <text x="37" y="128.4" text-anchor="middle" class="bar-label">850</text>
    <!-- mpnet+PCA(200)+GMM: 920 -->
    <rect x="50" y="101.6" width="22" height="208.4" rx="2" fill="url(#gbar2)" opacity="0.9"/>
    <text x="61" y="98.6" text-anchor="middle" class="bar-label">920</text>
    <!-- GSDMM: 310 -->
    <rect x="74" y="286.3" width="22" height="23.7" rx="2" fill="url(#gbar3)" opacity="0.9"/>
    <text x="85" y="283.3" text-anchor="middle" class="bar-label">310</text>
    <!-- TopiCLEAR: 880 -->
    <rect x="98" y="119.6" width="22" height="190.4" rx="2" fill="url(#gbar4)" opacity="0.9"/>
    <text x="109" y="116.6" text-anchor="middle" class="bar-label">880</text>
    <!-- UMAP(50)+GMM: 720 -->
    <rect x="122" y="178.6" width="22" height="131.4" rx="2" fill="url(#gbar1)" opacity="0.9"/>
    <text x="133" y="175.6" text-anchor="middle" class="bar-label">720</text>
    <!-- Fusion 流水线: 900 -->
    <rect x="146" y="112.0" width="22" height="198.0" rx="2" fill="url(#gbar2)" opacity="0.9"/>
    <text x="157" y="109.0" text-anchor="middle" class="bar-label">900</text>

    <!-- X labels -->
    <text x="37" y="325" text-anchor="end" class="method-label" transform="rotate(-60,37,325)">PCA+GMM</text>
    <text x="61" y="325" text-anchor="end" class="method-label" transform="rotate(-60,61,325)">mpnet+GMM</text>
    <text x="85" y="325" text-anchor="end" class="method-label" transform="rotate(-60,85,325)">GSDMM</text>
    <text x="109" y="325" text-anchor="end" class="method-label" transform="rotate(-60,109,325)">TopiCLEAR</text>
    <text x="133" y="325" text-anchor="end" class="method-label" transform="rotate(-60,133,325)">UMAP+GMM</text>
    <text x="157" y="325" text-anchor="end" class="method-label" transform="rotate(-60,157,325)">Fusion</text>
  </g>

  <!-- ============ Panel 3: Davies-Bouldin ============ -->
  <g transform="translate(380,0)">
