    <line x1="20" y1="262" x2="170" y2="262" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="214" x2="170" y2="214" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="167" x2="170" y2="167" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="119" x2="170" y2="119" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="72" x2="170" y2="72" stroke="#eee" stroke-width="0.5"/>

    <!-- Y-axis labels (3.5 to 1.0, reversed: 3.5 at bottom, 1.0 at top) -->
    <text x="16" y="313" text-anchor="end" class="tick-label">3.5</text>
    <text x="16" y="262" text-anchor="end" class="tick-label">3.0</text>
    <text x="16" y="214" text-anchor="end" class="tick-label">2.5</text>
    <text x="16" y="167" text-anchor="end" class="tick-label">2.0</text>
    <text x="16" y="119" text-anchor="end" class="tick-label">1.5</text>
    <text x="16" y="74" text-anchor="end" class="tick-label">1.0</text>

    <!-- Bar data: DB (lower is better, so 1.0=72, 3.5=310, range 2.5=238) -->
    <!-- PCA(50)+GMM: 1.8 -->
    <rect x="26" y="180.0" width="22" height="130.0" rx="2" fill="url(#gbar1)" opacity="0.9"/>
    <text x="37" y="177.0" text-anchor="middle" class="bar-label">1.8</text>
    <!-- mpnet+PCA(200)+GMM: 1.5 -->
    <rect x="50" y="130.0" width="22" height="180.0" rx="2" fill="url(#gbar2)" opacity="0.9"/>
    <text x="61" y="127.0" text-anchor="middle" class="bar-label">1.5</text>
    <!-- GSDMM: 2.9 -->
    <rect x="74" y="262.4" width="22" height="47.6" rx="2" fill="url(#gbar3)" opacity="0.9"/>
    <text x="85" y="259.4" text-anchor="middle" class="bar-label">2.9</text>
    <!-- TopiCLEAR: 1.6 -->
    <rect x="98" y="155.0" width="22" height="155.0" rx="2" fill="url(#gbar4)" opacity="0.9"/>
    <text x="109" y="152.0" text-anchor="middle" class="bar-label">1.6</text>
    <!-- UMAP(50)+GMM: 2.1 -->
    <rect x="122" y="206.6" width="22" height="103.4" rx="2" fill="url(#gbar1)" opacity="0.9"/>
    <text x="133" y="203.6" text-anchor="middle" class="bar-label">2.1</text>
    <!-- Fusion 流水线: 1.5 -->
    <rect x="146" y="130.0" width="22" height="180.0" rx="2" fill="url(#gbar2)" opacity="0.9"/>
    <text x="157" y="127.0" text-anchor="middle" class="bar-label">1.5</text>

    <!-- X labels -->
    <text x="37" y="325" text-anchor="end" class="method-label" transform="rotate(-60,37,325)">PCA+GMM</text>
    <text x="61" y="325" text-anchor="end" class="method-label" transform="rotate(-60,61,325)">mpnet+GMM</text>
    <text x="85" y="325" text-anchor="end" class="method-label" transform="rotate(-60,85,325)">GSDMM</text>
    <text x="109" y="325" text-anchor="end" class="method-label" transform="rotate(-60,109,325)">TopiCLEAR</text>
    <text x="133" y="325" text-anchor="end" class="method-label" transform="rotate(-60,133,325)">UMAP+GMM</text>
    <text x="157" y="325" text-anchor="end" class="method-label" transform="rotate(-60,157,325)">Fusion</text>
  </g>

  <!-- ============ Panel 4: Topic 连贯性 ============ -->
  <g transform="translate(570,0)">
    <text x="95" y="60" text-anchor="middle" class="axis-label" font-weight="bold">Topic 连贯性 ↑</text>
    <line x1="20" y1="72" x2="20" y2="310" stroke="#ccc" stroke-width="1"/>
    <line x1="20" y1="310" x2="170" y2="310" stroke="#ccc" stroke-width="1"/>

    <!-- Gridlines -->
    <line x1="20" y1="310" x2="170" y2="310" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="262" x2="170" y2="262" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="214" x2="170" y2="214" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="167" x2="170" y2="167" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="119" x2="170" y2="119" stroke="#eee" stroke-width="0.5"/>
    <line x1="20" y1="72" x2="170" y2="72" stroke="#eee" stroke-width="0.5"/>

    <!-- Y-axis labels (0.00 to 0.06) -->
    <text x="16" y="313" text-anchor="end" class="tick-label">0.00</text>
    <text x="16" y="262" text-anchor="end" class="tick-label">0.01</text>
    <text x="16" y="214" text-anchor="end" class="tick-label">0.02</text>
    <text x="16" y="167" text-anchor="end" class="tick-label">0.03</text>
    <text x="16" y="119" text-anchor="end" class="tick-label">0.04</text>
    <text x="16" y="74" text-anchor="end" class="tick-label">0.05</text>

    <!-- Bar data: 连贯性 (range 0→0.06 = 310→72, range=238 for 0.06) -->
    <!-- PCA(50)+GMM: 0.042 -->
    <rect x="26" y="119.6" width="22" height="190.4" rx="2" fill="url(#gbar1)" opacity="0.9"/>
    <text x="37" y="116.6" text-anchor="middle" class="bar-label">0.042</text>
    <!-- mpnet+PCA(200)+GMM: 0.055 -->
    <rect x="50" y="86.0" width="22" height="224.0" rx="2" fill="url(#gbar2)" opacity="0.9"/>
    <text x="61" y="83.0" text-anchor="middle" class="bar-label">0.055</text>
    <!-- GSDMM: 0.038 -->
    <rect x="74" y="139.2" width="22" height="170.8" rx="2" fill="url(#gbar3)" opacity="0.9"/>
    <text x="85" y="136.2" text-anchor="middle" class="bar-label">0.038</text>
    <!-- TopiCLEAR: 0.048 -->
    <rect x="98" y="98.0" width="22" height="212.0" rx="2" fill="url(#gbar4)" opacity="0.9"/>
    <text x="109" y="95.0" text-anchor="middle" class="bar-label">0.048</text>
    <!-- UMAP(50)+GMM: 0.040 -->
    <rect x="122" y="127.0" width="22" height="183.0" rx="2" fill="url(#gbar1)" opacity="0.9"/>
    <text x="133" y="124.0" text-anchor="middle" class="bar-label">0.040</text>
    <!-- Fusion 流水线: 0.050 -->
    <rect x="146" y="86.0" width="22" height="224.0" rx="2" fill="url(#gbar2)" opacity="0.9"/>
    <text x="157" y="83.0" text-anchor="middle" class="bar-label">0.050</text>

    <!-- X labels -->
