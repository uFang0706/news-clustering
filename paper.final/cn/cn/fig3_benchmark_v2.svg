  <!-- Callout box for Our 方法 -->
  <rect x="30" y="450" width="740" height="40" rx="4" fill="#fff8e1" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="40" y="467" fill="#d35400" font-size="9" font-weight="bold">Our 方法 (Leiden+FSM):</text>
  <text x="195" y="467" fill="#555" font-size="9">Silhouette = N/A (585 clusters ≠ 50 baseline)</text>
  <text x="195" y="482" fill="#555" font-size="9">Coverage = 94.3% · Topics = 585 · Hierarchy = 3-level · Outliers = 0</text>
</svg>
