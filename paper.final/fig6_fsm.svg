<svg width="950" height="450" viewBox="0 0 950 450" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:"DejaVu Sans",sans-serif}</style>
<rect width="950" height="450" fill="#020617"/>
<text x="475" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Figure 6. Pipeline Finite State Machine</text>
<text x="475" y="44" text-anchor="middle" fill="#94a3b8" font-size="10">Three-phase iteration with rule-first, LLM-second assessment strategy</text><rect x="40" y="120" width="100" height="50" rx="6" fill="#64748b" opacity="0.15" stroke="#64748b" stroke-width="2"/><text x="90" y="140" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold">INIT</text><text x="90" y="156" text-anchor="middle" fill="#94a3b8" font-size="7">Load dataset</text><text x="90" y="168" text-anchor="middle" fill="#94a3b8" font-size="7">& embeddings</text><rect x="200" y="120" width="100" height="50" rx="6" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="2"/><text x="250" y="140" text-anchor="middle" fill="#6366f1" font-size="11" font-weight="bold">CLUSTER</text><text x="250" y="156" text-anchor="middle" fill="#94a3b8" font-size="7">Leiden</text><text x="250" y="168" text-anchor="middle" fill="#94a3b8" font-size="7">+ centroid group</text><rect x="360" y="120" width="100" height="50" rx="6" fill="#22d3ee" opacity="0.15" stroke="#22d3ee" stroke-width="2"/><text x="410" y="140" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="bold">ASSESS</text><text x="410" y="156" text-anchor="middle" fill="#94a3b8" font-size="7">Rule scorer</text><text x="410" y="168" text-anchor="middle" fill="#94a3b8" font-size="7">→ LLM judge</text><rect x="520" y="120" width="100" height="50" rx="6" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="2"/><text x="570" y="140" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">SPLIT</text><text x="570" y="156" text-anchor="middle" fill="#94a3b8" font-size="7">k-NN+Leiden</text><text x="570" y="168" text-anchor="middle" fill="#94a3b8" font-size="7">on sub-community</text><rect x="680" y="120" width="100" height="50" rx="6" fill="#34d399" opacity="0.15" stroke="#34d399" stroke-width="2"/><text x="730" y="140" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">CHECK</text><text x="730" y="156" text-anchor="middle" fill="#94a3b8" font-size="7">6 stop</text><text x="730" y="168" text-anchor="middle" fill="#94a3b8" font-size="7">conditions</text><rect x="840" y="120" width="100" height="50" rx="6" fill="#f87171" opacity="0.15" stroke="#f87171" stroke-width="2"/><text x="890" y="140" text-anchor="middle" fill="#f87171" font-size="11" font-weight="bold">EXPORT</text><text x="890" y="156" text-anchor="middle" fill="#94a3b8" font-size="7">CSV + tree.json</text><text x="890" y="168" text-anchor="middle" fill="#94a3b8" font-size="7">+ summary.json</text><line x1="140" y1="145" x2="195" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="300" y1="145" x2="355" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="145" x2="515" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="620" y1="145" x2="675" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><line x1="780" y1="145" x2="835" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<polygon points="0,0 10,5 0,10" fill="#475569"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<polygon points="0,0 10,5 0,10" fill="#f87171"/></marker></defs><path d="M 730 170 Q 730 230 360 230 Q 310 230 310 170" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="550" y="225" text-anchor="middle" fill="#fbbf24" font-size="9">Not all stop conditions met → Next round</text><polygon points="730,290 770,280 810,290 770,300" fill="none" stroke="#34d399" stroke-width="1.5"/><text x="770" y="294" text-anchor="middle" fill="#34d399" font-size="7">6/6</text><text x="770" y="320" text-anchor="middle" fill="#94a3b8" font-size="7">Conditions met?</text><line x1="810" y1="290" x2="840" y2="250" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/><text x="815" y="275" fill="#f87171" font-size="9">NO → Loop</text><line x1="730" y1="290" x2="620" y2="250" stroke="#f87171" stroke-width="1.5"/><rect x="50" y="280" width="260" height="130" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,2"/><text x="180" y="300" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="bold">Rule Scorer (6 Deterministic Rules)</text><text x="65" y="315" fill="#94a3b8" font-size="8">• R1: Size < 30 → D-fragment (too small)</text><text x="65" y="332" fill="#94a3b8" font-size="8">• R2: Size > 15% total → C (split)</text><text x="65" y="349" fill="#94a3b8" font-size="8">• R3: Blacklist keywords → D-meta</text><text x="65" y="366" fill="#94a3b8" font-size="8">• R4: Domain entropy ≥ 4 → C (split)</text><text x="65" y="383" fill="#94a3b8" font-size="8">• R5: Centroid variance > 1.5× median → C</text><text x="65" y="400" fill="#94a3b8" font-size="8">• R6: No rule triggered → LLM Judge</text></svg>